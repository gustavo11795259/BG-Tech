<!DOCTYPE html>
<html lang="en">

            Tecnologia que impulsiona o mundo.

        <nav class="top-links">
            <a href="#">
                <i class="fa-solid fa-headset"></i>
                <span>Atendimento</span>
            </a>
            <a href="#">
                <i class="fa-solid fa-cart-shopping"></i>

                <h2 class="produto-preco"></h2>
            </div>
            <p class="parcelamento" id="produto-parcelamento"></p>
            <button class="btn-comprar">COMPRAR AGORA</button>
        </section>

    <footer class="rodape">
        <div class="logo-rodape">
            <img src="Img/Title.png" alt="">

        <div class="coluna">
