<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login - BGTECH</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="tech">
        <p>
            <i class="fa-brands fa-square-web-awesome"></i>
            Tecnologia que impulsiona o mundo.
        </p>
        <nav class="top-links">
            <a href="#">
                <i class="fa-solid fa-headset"></i>
                <span>Atendimento</span>
            </a>
            <a href="#">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Meus pedidos</span>
            </a>
            <a href="#">
                <i class="fa-solid fa-star"></i>
                <span>Favoritos</span>
            </a>
            <a href="cadastro.html">
                <i class="fa-solid fa-user"></i>
                <span>Entrar / Criar conta</span>
            </a>
        </nav>
    </div>
    <header class="header-principal">
        <a href="index.html" class="logo">
            <img src="Img/Title.png" alt="">
        </a>
        <nav>
            <a href="placas.html">PLACAS DE VÍDEO</a>
            <a href="processadores.html">PROCESSADORES</a>
            <a href="pcgamer.html">PC GAMER</a>
            <a href="cadeiras.html">CADEIRAS</a>
            <a href="monitor.html">MONITORES</a>
        </nav>
        <div class="search-box">
            <input type="text" placeholder="Oque você procura?">
            <button>
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
    </header>
    <main class="login-container">
       <section class="login-card">
            <div class="login-logo">
                <img src="Title.png" alt="LogoBGTech">
            </div>
            <h1>BG TECH</h1>
            <p class="login-subtitulo">O próximo nível do seu setup!</p>

            <input tyoe="radio" name="form" id="aba-login" checked>
            <input tyoe="radio" name="form" id="aba-cadastro">

            <div class="abas-login">
                <label for="aba-login">Entrar</label>
                <label for="aba-cadastro">Cadastrar</label>
            </div>

        <div class="login-forms">
            <form class="login-cadastro">
                <h2>BEM-VINDO DE VOLTA!</h2>
                <p class="login-descricao">Acesse sua conta</p>

                <label for="login-nome">Nome completo</label>
                <input type="text" id="login-nome" name="nome" placeholder="Digite seu nome completo" autocomplete="name" required>

                <label for="login-email">E-mail</label>
                <input type="email" id="login-email" name="email" placeholder="Digite seu e-mail" autocomplete="name" required>

                <label for="login-senha">Senha</label>
                <input type="password" id="login-senha" name="senha" placeholder="Digite sua senha" autocomplete="name" required>
                
                <div class="login-opcoes">
                    <label class="login-lembrar">
                        <input type="checkbox" name="lembrar">Lembrar de mim</label>
                        <a href="recuperacao">Esqueceu a senha?</a>
                </div>
                <button type="submit">ENTRAR</button>
            </form>

            <form class="login-cadastro">
                <h2>CRIE SUA CONTA!</h2>
                <p class="login-descricao">Cadastre-se para continuar</p>

                <label for="cadastro-nome">Nome completo</label>
                <input type="text" id="cadastro-nome" name="nome" placeholder="Digite seu nome completo" autocomplete="name" required>

                <label for="cadastro-email">E-mail</label>
                <input type="email" id="cadastro-email" name="email" placeholder="Digite seu e-mail" autocomplete="name" required>

                <label for="cadastro-senha">Senha</label>
                <input type="password" id="cadastro-senha" name="senha" placeholder="Digite sua senha" minlength="6" autocomplete="name" required>
                
                <label for="confirmar-senha">Confirmar senha</label>
                <input type="password" id="confirmar-senha" name="confirmar-senha"
                    placeholder="Confirme sua senha" minlength="6" autocomplete="name" required>

                <label class="cadastro-termos">
                    <input type="checkbox" name="termos" required>Aceito os termos de uso</label>
                <button type="submit">CADASTRAR</button>
            </form>
        </div>
       </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
